apiVersion: apps/v1
kind: Deployment
metadata:
  name: email-gateway
  namespace: production
  labels:
    app: email-gateway
    tier: external-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: email-gateway
  template:
    metadata:
      labels:
        app: email-gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: email-gateway
          image: mcp-demo/email-gateway:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: FAULT_MODE
              value: "healthy"
            - name: RATE_LIMIT_RPS
              value: "10"
          resources:
            requests:
              memory: "32Mi"
              cpu: "25m"
            limits:
              memory: "64Mi"
              cpu: "100m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: email-gateway
  namespace: production
spec:
  selector:
    app: email-gateway
  ports:
    - port: 80
      targetPort: 8080
