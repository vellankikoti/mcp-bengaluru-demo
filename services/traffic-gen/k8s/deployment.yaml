apiVersion: apps/v1
kind: Deployment
metadata:
  name: traffic-gen
  namespace: production
  labels:
    app: traffic-gen
    tier: tooling
spec:
  replicas: 1
  selector:
    matchLabels:
      app: traffic-gen
  template:
    metadata:
      labels:
        app: traffic-gen
    spec:
      containers:
        - name: traffic-gen
          image: mcp-demo/traffic-gen:latest
          imagePullPolicy: Never
          env:
            - name: RPS
              value: "3"
          resources:
            requests:
              memory: "32Mi"
              cpu: "25m"
            limits:
              memory: "64Mi"
              cpu: "100m"
