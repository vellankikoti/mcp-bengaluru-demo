apiVersion: v1
kind: Secret
metadata:
  name: mcp-agent-secrets
  namespace: mcp-system
type: Opaque
stringData:
  anthropic-api-key: "REPLACE_ME"   # set via: kubectl create secret generic mcp-agent-secrets -n mcp-system --from-literal=anthropic-api-key=sk-...
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-incident-agent
  namespace: mcp-system
  labels:
    app: mcp-incident-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-incident-agent
  template:
    metadata:
      labels:
        app: mcp-incident-agent
    spec:
      serviceAccountName: mcp-incident-agent
      containers:
        - name: agent
          image: mcp-demo/mcp-incident-agent:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: mcp-agent-secrets
                  key: anthropic-api-key
            - name: PORT
              value: "8080"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-incident-agent
  namespace: mcp-system
spec:
  selector:
    app: mcp-incident-agent
  type: NodePort
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
