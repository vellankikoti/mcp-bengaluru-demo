apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-incident-agent
  namespace: mcp-system
  labels:
    app.kubernetes.io/component: mcp-agent
    mcp.io/agent-type: incident-responder
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mcp-incident-agent
rules:
  # Read cluster state
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events", "services", "endpoints",
                "nodes", "namespaces", "configmaps", "resourcequotas",
                "persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch"]
  # Remediation (write) - scoped
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["patch", "update"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["patch", "update"]
  # Rollout restart via annotation patch
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["patch"]
  # Pod eviction
  - apiGroups: [""]
    resources: ["pods/eviction"]
    verbs: ["create"]
  # Node cordon/uncordon
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mcp-incident-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mcp-incident-agent
subjects:
  - kind: ServiceAccount
    name: mcp-incident-agent
    namespace: mcp-system
